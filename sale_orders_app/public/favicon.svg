<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Accent Gradient for Vision Rings -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Hexagonal Shield / Base -->
  <path d="M50 5 L90 28 L90 72 L50 95 L10 72 L10 28 Z" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Vision Ring / Aperture (Represents Vision/Logistics/Precision) -->
  <circle cx="50" cy="50" r="28" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="10 4" />

  <!-- Stylized Geometric Flash/Vision Lettermark -->
  <path d="M52 22 L35 48 L48 48 L38 78 L65 44 L50 44 Z" fill="#ffffff" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.25))" />
  
  <!-- Outer Glow Ring -->
  <path d="M50 12 A38 38 0 0 1 88 50 A38 38 0 0 1 50 88 A38 38 0 0 1 12 50 A38 38 0 0 1 50 12" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" />
</svg>
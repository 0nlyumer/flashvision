        // Simple JS to handle generic toggle visual state for the unchecked one in the demo
        const toggle2 = document.getElementById('toggle2');
        toggle2.addEventListener('change', function() {
            if(this.checked) {
                this.style.right = '0';
                this.style.borderColor = '#004277';
                this.nextElementSibling.style.backgroundColor = '#004277';
            } else {
                this.style.right = '1.25rem';
                this.style.borderColor = '#c1c7d2';
